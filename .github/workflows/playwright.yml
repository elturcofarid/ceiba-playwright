name: Playwright Tests a Demanda

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tags a ejecutar (regex de --grep), ej: @pacientes o @TC-PAC-001|@TC-PAC-002'
        required: false
        default: '@pacientes'

# Permiso obligatorio para que el GITHUB_TOKEN pueda crear y comentar issues
permissions:
  contents: read
  issues: write

# Evita dos ejecuciones simultáneas sobre la misma rama
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias del proyecto
        run: npm ci

      - name: Instalar navegadores de Playwright con dependencias del sistema
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas de Playwright
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          TAGS: ${{ inputs.tags }}
          # Configurar en Settings → Secrets and variables → Actions
          BASE_URL: ${{ secrets.BASE_URL }}
          CAJA_EMAIL: ${{ secrets.CAJA_EMAIL }}
          CAJA_PASSWORD: ${{ secrets.CAJA_PASSWORD }}
        run: npm run test

      - name: Subir reporte de Playwright
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 15
      
      - name: Subir trazas y screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 15
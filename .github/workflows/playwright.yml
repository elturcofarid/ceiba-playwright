name: Playwright Tests a Demanda

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tags a ejecutar (regex de --grep), ej: @pacientes o @TC-PAC-001|@TC-PAC-002'
        required: false
        default: '@pacientes'

# Permiso obligatorio para que el GITHUB_TOKEN pueda crear y comentar issues
permissions:
  contents: read
  issues: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias del proyecto
        run: npm ci

      - name: Instalar navegadores de Playwright con dependencias del sistema
        run: npx playwright install --with-deps

      - name: Generar specs desde los .feature
        run: npx bddgen

      - name: Ejecutar pruebas de Playwright
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          TAGS: ${{ github.event.inputs.tags }}
          # Configurar en Settings → Secrets and variables → Actions
          BASE_URL: ${{ secrets.BASE_URL }}
          CAJA_EMAIL: ${{ secrets.CAJA_EMAIL }}
          CAJA_PASSWORD: ${{ secrets.CAJA_PASSWORD }}
        run: npm run test

      - name: Subir reporte de Playwright en caso de fallo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 15